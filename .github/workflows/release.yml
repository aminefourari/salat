name: Release

# Push a tag like v1.2.0 → tests, an unsigned Salat.app build, and a GitHub Release with the zip.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26  # pinned: Swift 6 strict concurrency differs across Xcode versions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: brew install xcodegen
      - run: npm ci
      - run: npm test
      - run: npm run mac:test
      - name: Build Salat.app
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: VERSION="${VERSION#v}" npm run mac:build
      - name: Zip
        run: ditto -c -k --keepParent apps/macos/build/Salat.app "Salat-${GITHUB_REF_NAME}.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'MD'
          Salat for macOS (menu-bar adhan, Quran, adhkar). Free, unsigned build.

          **Install:** unzip, move `Salat.app` to Applications, then open it. macOS blocks unsigned apps the first time:
          open **System Settings → Privacy & Security** and click **Open Anyway**, or run
          `xattr -dr com.apple.quarantine /Applications/Salat.app` in Terminal.

          Requires macOS 15 or later. Already installed? Salat offers this update itself (Settings → General → Updates).
          MD
          gh release create "$GITHUB_REF_NAME" "Salat-${GITHUB_REF_NAME}.zip" --title "Salat $GITHUB_REF_NAME" --notes-file notes.md

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  macos:
    runs-on: macos-26  # pinned: Swift 6 strict concurrency differs across Xcode versions
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: npm run mac:test
      - name: Show test log on failure
        if: failure()
        run: tail -200 apps/macos/build/test.log

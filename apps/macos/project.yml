name: Salat
options:
  bundleIdPrefix: local.salat
  deploymentTarget:
    macOS: "15.0"
packages:
  Adhan:
    url: https://github.com/batoulapps/adhan-swift
    from: 1.5.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  Salat:
    type: application
    platform: macOS
    sources:
      - path: Salat
    dependencies:
      - package: Adhan
    info:
      path: Salat/Info.plist
      properties:
        CFBundleDisplayName: Salat
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.lifestyle
        NSLocationUsageDescription: Salat uses your location to calculate prayer times.
        NSLocationWhenInUseUsageDescription: Salat uses your location to calculate prayer times.
        ATSApplicationFontsPath: .
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.salat.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SalatTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SalatTests
      - path: ../../fixtures/parity.json
        buildPhase: resources
    dependencies:
      - target: Salat
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Salat.app/Contents/MacOS/Salat
schemes:
  Salat:
    build:
      targets:
        Salat: all
        SalatTests: [test]
    test:
      targets: [SalatTests]

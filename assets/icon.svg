<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e6a43"/>
      <stop offset="1" stop-color="#05361f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dc8c"/>
      <stop offset="0.55" stop-color="#d9b553"/>
      <stop offset="1" stop-color="#b38a2e"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="#000"/>
      <circle cx="470" cy="512" r="250" fill="#fff"/>
      <circle cx="560" cy="470" r="215" fill="#000"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <!-- Rub el Hizb: two overlapping squares, a quiet frame behind the crescent -->
  <g fill="none" stroke="#e7c86f" stroke-opacity="0.22" stroke-width="10" transform="translate(512 512)">
    <rect x="-300" y="-300" width="600" height="600"/>
    <rect x="-300" y="-300" width="600" height="600" transform="rotate(45)"/>
    <circle r="356" stroke-opacity="0.12"/>
  </g>
  <rect width="1024" height="1024" fill="url(#gold)" mask="url(#crescent)"/>
  <!-- small eight-pointed star in the crescent's opening -->
  <g fill="url(#gold)" transform="translate(640 455)">
    <rect x="-58" y="-58" width="116" height="116"/>
    <rect x="-58" y="-58" width="116" height="116" transform="rotate(45)"/>
  </g>
</svg>
